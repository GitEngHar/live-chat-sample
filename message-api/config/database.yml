# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Primary DB lives on RDS PostgreSQL (see infrastructure/rds.tf) — each ECS task has
# its own ephemeral filesystem with no shared volume, so the primary data (users, rooms)
# needs a real networked database. cache/queue/cable stay on local per-task SQLite: a
# reset cache or job queue on restart isn't a correctness problem, and the "cable" entry
# is unused since Action Cable's own adapter isn't active — anycable-rails handles
# broadcasting via config/cable.yml's any_cable adapter instead.
production:
  primary:
    adapter: postgresql
    url: <%= ENV.fetch("DATABASE_URL") %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
