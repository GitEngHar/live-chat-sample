services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../../frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_CABLE_URL: ws://localhost:8080/cable
    depends_on:
      - message-api

  message-api:
    build:
      context: ../../message-api
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      FRONTEND_ORIGIN: http://localhost:5173
      ANYCABLE_HTTP_BROADCAST_URL: http://anycable-go:8090/_broadcast
    volumes:
      - message_api_storage:/rails/storage

  # AnyCable RPC server: resolves Action Cable connections/channels for anycable-go over gRPC.
  # Runs from the message-api codebase (anycable-rails), reusing the same image/Dockerfile
  # with a different start command.
  rpc-server:
    build:
      context: ../../message-api
      dockerfile: Dockerfile
    command: ["bundle", "exec", "anycable"]
    ports:
      - "50051:50051"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      ANYCABLE_RPC_HOST: "0.0.0.0:50051"
    volumes:
      - message_api_storage:/rails/storage
    depends_on:
      - redis
      - message-api

  anycable-go:
    image: ghcr.io/anycable/anycable-go-pro:1.6
    ports:
      - "8080:8080"
    environment:
      ANYCABLE_HOST: "0.0.0.0"
      ANYCABLE_PORT: "8080"
      ANYCABLE_RPC_HOST: rpc-server:50051
      ANYCABLE_REDIS_URL: redis://redis:6379/0
      # Redis Brokerを有効化 (Reliable Streams / history + セッション再開)
      ANYCABLE_BROKER: "redis"
      # message-apiからのHTTPブロードキャストを引き続き受け付けつつ、
      # ノード間の再配信にredisx(Redis Streams)も使う
      ANYCABLE_BROADCAST_ADAPTER: "http,redisx"
      # AnyCable複数台間の再配信
      ANYCABLE_PUBSUB: "redis"
      # ---- Reliable Streams (履歴) ----
      # 1 streamあたり保持する最大メッセージ数
      ANYCABLE_HISTORY_LIMIT: "100"
      # 履歴の保持期間（秒）
      ANYCABLE_HISTORY_TTL: "300"
      # ---- Session ----
      # 切断後のSession保持期間（秒）
      ANYCABLE_SESSIONS_TTL: "300"
      ANYCABLE_PRESETS: "broker"
      ANYCABLE_PRESENCE: "true"
      ANYCABLE_PRESENCE_TTL: "15"
    depends_on:
      - rpc-server

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  message_api_storage:
